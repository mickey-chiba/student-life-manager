services:
  - type: web
    name: campus-compass
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-compass-db
          property: connectionString

databases:
  - name: campus-compass-db
